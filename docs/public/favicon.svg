<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tourara">
  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <!-- spotlight frame -->
  <rect x="8" y="8" width="32" height="28" rx="4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- dim overlay suggestion -->
  <path d="M8 12v20a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V12" fill="#3b82f6" opacity="0.12"/>
  <!-- tooltip card -->
  <rect x="22" y="34" width="34" height="22" rx="5" fill="#101826" stroke="#e8eefc" stroke-width="1.25"/>
  <!-- caret pointing to spotlight -->
  <path d="M36 34 L40 28 L44 34 Z" fill="#101826" stroke="#e8eefc" stroke-width="1" stroke-linejoin="round"/>
  <!-- accent dot -->
  <circle cx="48" cy="45" r="3" fill="#f5c542"/>
</svg>
